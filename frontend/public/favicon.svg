<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00272B"/>
      <stop offset="100%" stop-color="#00181A"/>
    </linearGradient>
    <linearGradient id="rust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4624b"/>
      <stop offset="100%" stop-color="#964734"/>
    </linearGradient>
  </defs>

  <!-- Deep Teal Container with rounded forensic bezel -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#0FA4AF" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- Blindspot Geometric 'B' Symbol -->
  <g transform="translate(16, 11) scale(1.33)">
    <!-- Top Cyan Accent Bar -->
    <path d="M 4 0 H 20 L 24 4 V 6 H 0 V 4 L 4 0 Z" fill="#0FA4AF"/>
    
    <!-- Main Geometric B Body in Terracotta / Rust -->
    <path d="M 0 9 H 18 L 23 14 V 17 L 19 19 L 24 24 V 28 L 20 32 H 0 Z M 6 14 H 17 V 16 H 6 Z M 6 23 H 17 V 27 H 6 Z" fill="url(#rust)" fill-rule="evenodd"/>
  </g>

  <!-- Optical Focal Target Pip in Top-Right -->
  <circle cx="50" cy="14" r="2.5" fill="#0FA4AF"/>
</svg>
