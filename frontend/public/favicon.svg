<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Radiant Cyan Gradient -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFFF"/>
      <stop offset="100%" stop-color="#0FA4AF"/>
    </linearGradient>
    <!-- Radiant Rust / Terracotta Gradient -->
    <linearGradient id="rustGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B4A"/>
      <stop offset="100%" stop-color="#E63E1C"/>
    </linearGradient>
    <!-- Subtle dark backing badge for 100% visibility on white & grey tabs -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- High-contrast badge container ensuring pop on dark tabs and light tabs -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="#00181A" stroke="#00FFFF" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Top Crown Accent (Electric Cyan) -->
  <path d="M 8 5 H 21 L 24 8 V 9 H 5 V 8 L 8 5 Z" fill="url(#cyanGlow)"/>

  <!-- Main Chunky B Body (Vibrant Rust/Coral) -->
  <path d="M 5 11 H 20 L 25 15 V 17 L 21 19 L 26 23 V 26 L 22 29 H 5 Z M 10 14 H 18 V 16 H 10 Z M 10 21 H 19 V 25 H 10 Z" fill="url(#rustGlow)" fill-rule="evenodd"/>

  <!-- Optical Blindspot Aperture / Target Pip (Blazing Neon Cyan Dot) -->
  <circle cx="25.5" cy="6.5" r="2.5" fill="#00FFFF"/>
  <circle cx="25.5" cy="6.5" r="1.2" fill="#FFFFFF"/>
</svg>
